<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0b24" />
    <!-- Apply the saved colour theme before the first paint, so the page never flashes the default. -->
    <script>
      try {
        var bar = { pl: '#37003c', light: '#f4f7fb' };
        var saved = JSON.parse(localStorage.getItem('plg:theme'));
        if (bar[saved]) {
          document.documentElement.dataset.theme = saved;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bar[saved]);
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Premier League mini-games powered by real player values and a machine-learning valuation model. In English and Polish." />
    <meta property="og:title" content="PL Games" />
    <meta property="og:description" content="Guess the Player, Road to 100, Higher or Lower, Budget XI, Beat the Model and Price Tag: Premier League games priced by data." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PL Games: Premier League games, priced by data, with the 20 club crests" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%og.png" />
    <title>PL Games</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Start the data while the script loads: every page waits for it. -->
    <link rel="preload" href="./data/players.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./data/meta.json" as="fetch" crossorigin="anonymous" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PL Games" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
